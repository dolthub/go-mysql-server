name: Test Integration with Dolt and DoltgreSQL

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: dependency-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.setup_gms.outputs.skip }}
      dolt_pr_linked: ${{ steps.check_pr.outputs.dolt_pr_linked == 'true' }}
      doltgresql_pr_linked: ${{ steps.check_pr.outputs.doltgresql_pr_linked == 'true' }}
    steps:
      - name: Checkout go-mysql-server
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup go-mysql-server
        id: setup_gms
        uses: ./.github/actions/setup-gms

      - name: Check for PR links
        id: check_pr
        if: steps.setup_gms.outputs.skip == 'false'
        run: |
          PR_DESCRIPTION=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }})
          COMMENTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments)
          BODY="$PR_DESCRIPTION$COMMENTS"
          if echo "$BODY" | grep -Eq "github.com/dolthub/dolt/pull/|dolthub/dolt#[0-9]"; then
            echo "dolt_pr_linked=true" >> $GITHUB_OUTPUT
          else
            echo "dolt_pr_linked=false" >> $GITHUB_OUTPUT
          fi
          if echo "$BODY" | grep -Eq "github.com/dolthub/doltgresql/pull/|dolthub/doltgresql#[0-9]"; then
            echo "doltgresql_pr_linked=true" >> $GITHUB_OUTPUT
          else
            echo "doltgresql_pr_linked=false" >> $GITHUB_OUTPUT
          fi

  test-dolt:
    needs: setup
    if: needs.setup.outputs.skip == 'false'
    runs-on: ubuntu-latest
    env:
      TZ: "America/Los_Angeles"
    steps:
      - name: Checkout go-mysql-server
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup go-mysql-server
        uses: ./.github/actions/setup-gms

      - name: Checkout Dolt
        uses: actions/checkout@v6
        with:
          repository: dolthub/dolt
          path: dolt

      - name: Test Dolt against PR
        id: test_pr
        continue-on-error: true
        run: |
          cd dolt/go
          go mod edit -replace github.com/dolthub/go-mysql-server=../..
          go mod tidy
          cd libraries/doltcore/sqle/enginetest
          go test ./... --count=1 -skip TestDoltServerRunningUnixSocket

      - name: Test Dolt against main
        if: steps.test_pr.outcome == 'failure'
        env:
          PR_LINKED: ${{ needs.setup.outputs.dolt_pr_linked }}
        run: |
          # Fails the job, unless this PR links a Dolt PR, in which case the failure is expected
          # to be fixed there and is only reported as a warning.
          report() {
            if [ "$PR_LINKED" = "true" ]; then
              echo "::warning title=$1::$2 Not failing because this PR links a Dolt PR."
              echo "### :warning: $2 Not failing because this PR links a Dolt PR." >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            echo "::error title=$1::$2"
            echo "### :x: $2" >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          cd dolt/go
          git reset --hard
          go get github.com/dolthub/go-mysql-server@main
          go mod tidy
          cd libraries/doltcore/sqle/enginetest
          if go test ./... --count=1 -skip TestDoltServerRunningUnixSocket; then
            report "Dolt tests fail against PR" "Dolt tests passed against go-mysql-server main but failed against this PR."
          fi
          report "Dolt tests fail against main" "Dolt tests failed against both this PR and go-mysql-server main. Check that the PR's failures are the same as main's and aren't caused by this PR."

  test-doltgresql:
    needs: setup
    if: needs.setup.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Set timezone for Unix
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "America/Los_Angeles"

      - name: Checkout go-mysql-server
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup go-mysql-server
        uses: ./.github/actions/setup-gms

      - name: Checkout DoltgreSQL repository
        uses: actions/checkout@v6
        with:
          repository: dolthub/doltgresql
          path: doltgresql

      - name: Build DoltgreSQL parser
        run: |
          cd doltgresql
          ./postgres/parser/build.sh

      - name: Test DoltgreSQL against PR
        id: test_pr
        continue-on-error: true
        run: |
          cd doltgresql
          go mod edit -replace github.com/dolthub/go-mysql-server=..
          go mod tidy
          cd testing/go
          go test ./... --count=1 -skip Replication

      - name: Test DoltgreSQL against main
        if: steps.test_pr.outcome == 'failure'
        env:
          PR_LINKED: ${{ needs.setup.outputs.doltgresql_pr_linked }}
        run: |
          # Fails the job, unless this PR links a DoltgreSQL PR, in which case the failure is expected
          # to be fixed there and is only reported as a warning.
          report() {
            if [ "$PR_LINKED" = "true" ]; then
              echo "::warning title=$1::$2 Not failing because this PR links a DoltgreSQL PR."
              echo "### :warning: $2 Not failing because this PR links a DoltgreSQL PR." >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            echo "::error title=$1::$2"
            echo "### :x: $2" >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          cd doltgresql
          git reset --hard
          go get github.com/dolthub/go-mysql-server@main
          go mod tidy
          cd testing/go
          if go test ./... --count=1 -skip Replication; then
            report "DoltgreSQL tests fail against PR" "DoltgreSQL tests passed against go-mysql-server main but failed against this PR."
          fi
          report "DoltgreSQL tests fail against main" "DoltgreSQL tests failed against both this PR and go-mysql-server main. Check that the PR's failures are the same as main's and aren't caused by this PR."
